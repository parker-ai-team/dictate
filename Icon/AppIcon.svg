<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Dictate app icon. Apple macOS icon grid: 1024 canvas, 824 px squircle at (100,100),
       corner radius 185. Motif: a sound waveform flowing into a text cursor (I-beam). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="0.55" stop-color="#3D5BF2"/>
      <stop offset="1" stop-color="#2733B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECFF"/>
    </linearGradient>
  </defs>

  <!-- squircle body with depth -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#shade)"/>
  <!-- inner top highlight -->
  <rect x="104" y="104" width="816" height="816" rx="181" ry="181" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"/>

  <!-- waveform: five rounded bars, mirrored around the vertical centre (y = 512) -->
  <g fill="url(#ink)">
    <rect x="238" y="437" width="58" height="150" rx="29"/>
    <rect x="326" y="347" width="58" height="330" rx="29"/>
    <rect x="414" y="282" width="58" height="460" rx="29"/>
    <rect x="502" y="372" width="58" height="280" rx="29"/>
    <rect x="590" y="422" width="58" height="180" rx="29"/>
  </g>

  <!-- text cursor (I-beam): the place the words land -->
  <g fill="url(#ink)">
    <rect x="721" y="290" width="44" height="444" rx="12"/>
    <rect x="677" y="290" width="132" height="44" rx="14"/>
    <rect x="677" y="690" width="132" height="44" rx="14"/>
  </g>
</svg>
